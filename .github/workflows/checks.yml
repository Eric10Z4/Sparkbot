name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi==0.115.12 httpx==0.28.1 websockets==15.0.1
      - run: python -B -m unittest discover -s tests -v
      - run: python -m compileall -q SparkAgentServer openclaw/skills
      - name: Prevent tracked local firmware credentials
        run: |
          test -z "$(git ls-files factory_demo_v1/sdkconfig factory_demo_v1/sdkconfig.old view/tests/test_images 'view/tests/visual_assets/face_*' 'view/tests/visual_assets/scene_gen_*' view/CV_ASSET_TEST_REPORT.md)"
